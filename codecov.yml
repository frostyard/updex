# Codecov configuration for updex.
#
# Coverage is uploaded by the "Unit Tests" job in .github/workflows/test.yml.
# The gates below run as status checks on pull requests only once the
# repository is onboarded on codecov.io; the enforced 80.0% total
# statement-coverage floor lives in scripts/check-coverage.sh and runs in the
# same job (`make coverage-check`) and in `make ci`.

coverage:
  precision: 2
  round: down
  range: "50...90"

  status:
    project:
      default:
        # Compare against the base commit; allow a small drop so that
        # unrelated refactors do not block a pull request.
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        # New and changed lines should be covered by tests.
        target: 70%
        threshold: 5%
        if_ci_failed: error

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true

ignore:
  - "**/*_test.go"
  - "internal/testutil/**"
  - "docs/**"
  - "scripts/**"
