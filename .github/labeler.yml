documentation:
  - changed-files:
      - any-glob-to-any-file: "**/*.md"

go:
  - changed-files:
      - any-glob-to-any-file: "**/*.go"

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/actions/**"
          - ".github/dependabot.yml"
          - ".github/labeler.yml"
          - ".github/workflows/**"

dependencies:
  - any:
      - head-branch: "^dependabot/"
      - changed-files:
          - any-glob-to-any-file:
              - "go.mod"
              - "go.sum"
