name: Automated Copilot Code Review

# This workflow runs on pull_request, not pull_request_target: GitHub blocks
# pull_request_target by default in a public repository from 2026-12-02, and
# only the PR triage caller (risk-paths.yml) is allowed it
# (frostyard/core docs/design/pull-request-target-policy.md). A pull request
# from a fork gets a read-only token, so its job is skipped.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: auto-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    name: Request Copilot review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Never check out or execute pull-request-controlled code in this
      # workflow: it holds a pull-requests: write token.
      - name: Request review
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid pull request number: $PR_NUMBER"
            exit 1
          fi

          # Copilot review requests are asynchronous. A successful API response may
          # omit Copilot from requested_reviewers even though a review is queued.
          if ! jq -n '{reviewers: ["copilot-pull-request-reviewer[bot]"]}' |
            gh api \
              --method POST \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" \
              --input - \
              --silent; then
            echo "::warning::GitHub did not accept the Copilot review request; verify Copilot code review is enabled"
            echo "⚠️ GitHub did not accept the Copilot review request for pull request #$PR_NUMBER." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Submitted a Copilot review request for pull request #$PR_NUMBER." >>"$GITHUB_STEP_SUMMARY"
