# .github/workflows/release.yml
name: goreleaser

on:
  push:
    # run only against tags
    tags:
      - "*"

permissions:
  contents: write
  # packages: write
  # issues: write
  # id-token and attestations let actions/attest-build-provenance sign the
  # release artifacts with GitHub's Sigstore instance (verify with
  # `gh attestation verify <artifact> --repo frostyard/updex`).
  id-token: write
  attestations: write

jobs:
  # A tag push is the only trigger that publishes, and it does not have to
  # point at a commit the Tests workflow ever saw green (a tag on an old
  # commit, on a branch, or on a `main` whose checks failed). This job runs
  # the same credential-free gate `make ci` gives a developer and the pull
  # request jobs give `main` — verify-static (tidy, vet, gofmt, pinned
  # golangci-lint), unit tests with the coverage floor, e2e, the race
  # detector, and the linux amd64/arm64 cross-builds — so a tag that fails
  # them cannot reach GoReleaser, the provenance attestation, the R2
  # publish, or the snosi dispatch below. It introduces no tooling the
  # Tests workflow does not already install.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Same mise.toml/mise.lock-pinned golangci-lint the Tests workflow's
      # Lint job installs (core ADR-0043), so the gate's lint step cannot
      # drift from the pull request's.
      - name: Install pinned tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          install_args: golangci-lint
          cache: true

      - name: Run the CI gate
        run: make ci

  goreleaser:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # More assembly might be required: Docker logins, GPG, etc.
      # It all depends on your needs.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser-pro
          # 'latest', 'nightly', or a semver
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Your GoReleaser Pro key, if you are using the 'goreleaser-pro' distribution
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      # Build provenance: binds each distributable asset and checksums.txt to
      # this workflow run, so a user can prove a download came from a tag
      # release of this repository (`gh attestation verify`), not just that it
      # matches a checksums.txt served from the same origin.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk

      - name: Publish to frostyard repo
        uses: frostyard/repogen/.github/actions/publish-to-r2@6648671cec7015231fac1f278f09ee5799281bc9 # main
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: frostyardrepo
          purge-cache: "true"
          cloudflare-zone: ${{ secrets.CLOUDFLARE_ZONE }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gpg-private-key: ${{ secrets.REPOGEN_GPG_KEY }}
          packages-dir: ./dist
          package-type: deb # or sysext
          base-url: https://repository.frostyard.org # required for sysext

      - name: Kickoff snosi
        continue-on-error: true
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.ORG_PAT }}
          repository: frostyard/snosi
          event-type: build
