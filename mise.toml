# Tool pins for this repository (core ADR-0043).
# Go comes from go.mod — never pin it here. Every tool the gates invoke
# beyond what the CI runner image provides is listed; mise.lock carries the checksums.
[settings]
idiomatic_version_file_enable_tools = ["go"]
lockfile = true

[tools]
golangci-lint = "2.15.0"
node = "24"
svu = "3.4.1"
